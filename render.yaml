services:
  - type: web
    name: gatekeeper-api
    runtime: docker
    dockerfilePath: api/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MLFLOW_TRACKING_URI
        value: sqlite:///nonexistent/mlflow.db
        # Forces Strategy 3 (standalone skops file) — no local MLflow DB needed
