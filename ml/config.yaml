# Feature columns for the ML model
feature_columns:
  - lines_added
  - lines_deleted
  - files_touched
  - dirs_touched
  - author_prior_commits
  - hour_of_day
  - day_of_week
  - commit_msg_length
  - is_fix_bug_revert

# LightGBM hyperparameters
lightgbm_params:
  num_leaves: 31
  learning_rate: 0.05
  n_estimators: 100

# Label window in days for identifying risky commits
label_window_days: 7