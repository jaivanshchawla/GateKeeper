# Feature columns for the ML model
# 19 features: 9 base + 4 file history + 6 change-shape
feature_columns:
  # Original 9 base features
  - lines_added
  - lines_deleted
  - files_touched
  - dirs_touched
  - author_prior_commits
  - hour_of_day
  - day_of_week
  - commit_msg_length
  - is_fix_bug_revert
  # M.1a: File-level history (backward-looking, no leakage)
  - file_prior_changes_max
  - file_prior_changes_mean
  - file_prior_risky_max
  - file_prior_risky_mean
  - file_revert_count_max
  - file_revert_count_mean
  - file_age_days_max
  - file_age_days_mean
  - file_authors_count_max
  - file_authors_count_mean
  - days_since_last_change_max
  - days_since_last_change_mean
  # M.1b: Author-file familiarity
  - author_file_prior_commits_max
  - author_file_prior_commits_mean
  - author_dir_prior_commits_max
  - author_dir_prior_commits_mean
  - is_author_first_touch_file
  - is_author_first_touch_dir
  - author_days_since_last_commit
  # M.1c: Change-shape
  - churn_ratio
  - change_entropy
  - max_file_churn
  - is_test_only
  - test_to_code_ratio
  - config_touch
  - is_merge
  - files_per_dir_ratio

# LightGBM hyperparameters
lightgbm_params:
  num_leaves: 31
  learning_rate: 0.05
  n_estimators: 100

# Label window in days for identifying risky commits
label_window_days: 7

# Percentile-based risk thresholds (replaces absolute 0.3/0.6 cutoffs).
# Computed from the full training set's score distribution per repo.
# high: top 10% of that repo's scores, medium: next 15%, low: bottom 75%.
# _global: fallback for repos not in the training set.
thresholds:
  django:
    high: 0.8029
    medium: 0.6841
  react:
    high: 0.8839
    medium: 0.8042
  rust:
    high: 0.8632
    medium: 0.7659
  kubernetes:
    high: 0.8543
    medium: 0.7301
  kafka:
    high: 0.8752
    medium: 0.7573
  _global:
    high: 0.8619
    medium: 0.7536