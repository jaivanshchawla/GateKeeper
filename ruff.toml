# Ruff configuration for Gatekeeper
# Keep import sorting (I001) and unused imports (F401) enforced,
# but ignore noisy style rules in analysis/script files.

[lint]
# Rules that ruff --fix auto-corrects (causing stash conflicts in pre-commit)

# Per-file ignores for analysis scripts and model loading code
[lint.per-file-ignores]
"scripts/analysis_*.py" = ["E402", "B023", "RUF059", "PLW1510", "PIE810", "RUF100"]
"pipelines/*.py" = ["E402"]
"ml/rebuild_b2.py" = ["B023", "DTZ005", "DTZ007", "PLW1510", "RUF059"]
"ml/history_features.py" = ["SIM222"]
"tests/*" = ["DTZ001", "DTZ005", "RUF013", "BLE001"]
"api/main.py" = ["BLE001", "SIM115", "S110"]
"scripts/score_pr.py" = ["BLE001", "S110", "PLR1722", "SIM115", "RUF013"]
# Same shape of code as score_pr.py above (best-effort subprocess + model
# loading); it was simply missing from this list.
"scripts/pre_push_score.py" = ["BLE001", "PLW1510", "SIM115", "RUF059"]
# Hook scripts run inside git commands. A hook that raises can abort a
# commit, merge or checkout, so several of them deliberately catch broadly
# and degrade to a warning.
"scripts/hooks/*.py" = ["BLE001"]
"scripts/check_data_leakage.py" = ["RUF059"]
"webhook/*.py" = ["BLE001", "DTZ003", "DTZ005", "PLW1508"]
"webhook/**/*.py" = ["BLE001", "DTZ003", "DTZ005", "PLW1508"]
