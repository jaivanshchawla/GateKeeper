services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3000:8000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///app/mlflow.db
      - DATABASE_URL=postgresql://gatekeeper:gatekeeper@postgres:5432/gatekeeper
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gatekeeper-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=gatekeeper
      - POSTGRES_PASSWORD=gatekeeper
      - POSTGRES_DB=gatekeeper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gatekeeper-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - gatekeeper-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=gatekeeper
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - gatekeeper-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  gatekeeper-network:
    driver: bridge
