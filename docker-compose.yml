services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///app/mlflow.db
    volumes:
      - .:/app
    depends_on:
      - webhook
    networks:
      - gatekeeper-network

  webhook:
    build:
      context: .
      dockerfile: webhook/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://gatekeeper:gatekeeper@postgres:5432/gatekeeper
    volumes:
      - .:/app
    depends_on:
      - postgres
    networks:
      - gatekeeper-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=gatekeeper
      - POSTGRES_PASSWORD=gatekeeper
      - POSTGRES_DB=gatekeeper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gatekeeper-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - webhook
    networks:
      - gatekeeper-network

volumes:
  postgres_data:

networks:
  gatekeeper-network:
    driver: bridge