# Gate 2: PR Risk Scoring
# Scores the risk of each commit in a PR and posts a comment

name: Gate 2 - PR Risk Score

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  score-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install skops

      - name: Score PR commits
        id: score
        run: |
          # Get the PR's head commit
          COMMIT_SHA=${{ github.event.pull_request.head.sha }}
          
          echo "Scoring commit: $COMMIT_SHA"
          
          # Run the scoring script
          python scripts/score_pr.py \
            --repo-path . \
            --commit-hash $COMMIT_SHA \
            --model-path models/gatekeeper_risk_model.skops \
            --config ml/config.yaml \
            2>&1 | tee /tmp/score_output.txt
          
          # Extract the markdown content (between the === lines)
          sed -n '/^## 🛡️/,/^\*Scored by/p' /tmp/score_output.txt > /tmp/pr_comment.md
          
          # If extraction failed, use the full output
          if [ ! -s /tmp/pr_comment.md ]; then
            cat /tmp/score_output.txt > /tmp/pr_comment.md
          fi
          
          # Set outputs
          echo "comment_file=/tmp/pr_comment.md" >> $GITHUB_OUTPUT

      - name: Find existing Gatekeeper comment
        id: find_comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "Gatekeeper Risk Assessment"

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: /tmp/pr_comment.md
          edit-mode: replace
