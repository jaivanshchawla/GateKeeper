# Validates the husky-managed git hooks.
#
# Three jobs, because they fail for different reasons and one is fast:
#
#   hooks     -- installs husky for real on three operating systems, checks the
#                wiring, and runs the hook suite. No ML dependencies.
#   installer -- the install/uninstall lifecycle across the Node versions the
#                package claims to support.
#   suite     -- runs the project's own test suite, so a hook change cannot
#                break the thing it is gating.
#
# The `hooks` matrix mirrors husky's own CI (ubuntu/macOS/Windows), because the
# bootstrap in .husky/lib/bootstrap.sh exists specifically to survive the
# differences between them. That job runs the shell-level specs by way of the
# test suite: an init.sh that is really sourced, one that turns the hooks off
# with HUSKY=0, and a `set -u` shell are all asserted there on all three OSes.

name: Hooks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    name: hooks (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --ignore-scripts keeps `prepare` from running before Node is ready;
      # the install is then done explicitly so a failure is attributable.
      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install hooks
        # CI=true makes install.mjs skip by default, so force it here: this
        # job's whole purpose is to exercise the real setup path.
        env:
          HUSKY: "1"
        run: node .husky/install.mjs

      # --strict: this job installed everything, so a "missing from this
      # machine" warning here really is a failure.
      - name: Verify the hook wiring
        run: python -m scripts.hooks.verify --strict

      - name: List the hook inventory
        run: |
          python -m scripts.hooks.verify --list
          python -m scripts.hooks.verify --list 2>&1 | grep -q "14/14 husky hooks"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run the hook tests
        run: python -m pytest tests/test_hooks.py tests/test_hook_integration.py -q

      # Exercises the real .husky/_ -> .husky/<hook> -> module chain rather
      # than calling the modules directly, on the shell git actually uses.
      - name: Run the real pre-commit shim
        if: runner.os != 'Windows'
        run: sh .husky/_/pre-commit

      # The git-am and housekeeping hooks, through the same chain. Nothing is
      # staged in a fresh checkout, so they should report clean and exit 0.
      - name: Run the real git-am and gc shims
        if: runner.os != 'Windows'
        run: |
          sh .husky/_/pre-applypatch
          sh .husky/_/post-applypatch
          sh .husky/_/pre-auto-gc

      # HUSKY=2 turns on husky's own `set -x`. It must reach the Python layer
      # too, which is where the interpreter decision is actually made.
      - name: Trace a hook end to end
        if: runner.os == 'Linux'
        run: |
          HUSKY=2 sh .husky/_/pre-auto-gc 2>&1 | tee trace.log
          grep -q "pre-auto-gc: interpreter=" trace.log

      # The damage `npx husky --version` does must be caught, not tolerated.
      - name: The doctor catches a flag-shaped hooksPath
        if: runner.os == 'Linux'
        run: |
          git config core.hooksPath --version/_
          if python -m scripts.hooks.verify >/dev/null 2>&1; then
            echo "::error::the doctor accepted a flag-shaped core.hooksPath"
            exit 1
          fi
          git config core.hooksPath .husky/_

      - name: Reject a bad commit subject through the real commit-msg shim
        if: runner.os != 'Windows'
        run: |
          printf 'this is not conventional\n' > "$RUNNER_TEMP/msg"
          if sh .husky/_/commit-msg "$RUNNER_TEMP/msg"; then
            echo "::error::commit-msg accepted an invalid subject"
            exit 1
          fi

      # The bootstrap exists to survive Windows specifically (the Microsoft
      # Store python3 alias, dash/underscore module names), so it is exercised
      # there too, via the same shell Git would use.
      - name: Resolve the interpreter through the real bootstrap
        if: runner.os == 'Windows'
        shell: bash
        run: |
          . .husky/lib/bootstrap.sh
          gatekeeper_run_hook post-checkout 0 0 0

      # Errors only. Style findings on a 37-line bootstrap are noise, but a
      # genuine syntax error in the sh layer would take every hook down with
      # no error from git at all, which is exactly what this catches.
      #
      # Every shim, not a hand-picked few: the list comes from the same tuple
      # the doctor and the tests read, so adding a hook cannot quietly skip
      # this check.
      - name: Shellcheck every hook shell script
        if: runner.os == 'Linux'
        run: |
          shellcheck --shell=sh --severity=error .husky/lib/bootstrap.sh .husky/lib/common.sh
          python -c "from scripts.hooks import _runtime as rt; print(' '.join('.husky/' + h for h in rt.HOOKS))" > shims.txt
          # shellcheck disable=SC2046
          shellcheck --shell=sh --severity=error $(cat shims.txt)

  installer:
    name: installer (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >=18, so the floor is asserted as
        # well as the two versions someone is likely to be running.
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --ignore-scripts so the lifecycle is driven explicitly and a failure
      # can be attributed to the step that caused it.
      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install, uninstall and reinstall
        env:
          HUSKY: "1"
        run: |
          set -e
          node .husky/install.mjs
          test "$(git config --get core.hooksPath)" = ".husky/_"
          test -f .husky/_/h

          # husky v9 removed `husky uninstall`. Unsetting the key alone would
          # leave the generated shims for the next install to inherit.
          node .husky/uninstall.mjs
          test -z "$(git config --get core.hooksPath || true)"
          test ! -d .husky/_

          node .husky/install.mjs
          test "$(git config --get core.hooksPath)" = ".husky/_"
          python -m scripts.hooks.verify --strict

      - name: A production install must not fail for want of a devDependency
        env:
          NODE_ENV: production
        run: |
          node .husky/install.mjs
          test "$(git config --get core.hooksPath)" = ".husky/_"

  suite:
    name: project test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately not `-r requirements.txt`: running tests/ does not need
      # tensorflow, feast or kfp, and pulling them turns a 1-minute job into a
      # 10-minute one.
      #
      # The list was derived by walking the import graph from tests/ rather than
      # guessed. httpx is kept even though nothing imports it: starlette's
      # TestClient needs it at runtime, which is exactly the kind of gap a
      # static reading misses. requests and pydantic are cheap insurance for
      # the same reason. prometheus_fastapi_instrumentator and uvicorn are
      # genuinely optional (guarded / under __main__), so they are left out.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest httpx numpy pandas scikit-learn lightgbm mlflow skops \
            pyyaml pydriller fastapi shap sqlalchemy requests pydantic

      - name: Run the test suite
        run: python -m pytest tests/ -q
