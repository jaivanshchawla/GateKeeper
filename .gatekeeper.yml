# Gatekeeper Configuration
# Override per-repo by placing .gatekeeper.yml in your repo root.
# See docs for each rule's options.

rules:
  large_change:
    max_lines: 500
    severity: warn

  too_many_files:
    max_files: 20
    severity: warn

  no_tests:
    severity: warn
    exempt_paths:
      - "docs/**"
      - "*.md"
      - "*.rst"

  config_and_code:
    severity: warn

  revert_hotspot:
    revert_count: 3
    window_days: 60
    severity: block

  first_touch:
    severity: info

  weekend_deploy:
    severity: info

  stale_file:
    days: 180
    severity: info

  direct_to_main:
    severity: warn

ml_scoring:
  enabled: true
  band_thresholds:
    high: 0.90
    medium: 0.75

reviewer_suggestions:
  enabled: true
  max_suggestions: 3
  half_life_days: 180
  exclude_bots: true
  bot_patterns:
    - "dependabot"
    - "renovate"
    - "*[bot]"
    - "github-actions"

content_analysis:
  enabled: true  # default true locally, false for hosted API

# U.5a: Risk Budget
risk_budget:
  enabled: true
  window_days: 30
  max_high_pct: 0.20  # max 20% high-band commits in rolling window
  warn_threshold: 0.80  # warn at 80% of budget

# U.5b: Scoped Policy
branch_rules:
  main:
    large_change: block
    config_and_code: block
    revert_hotspot: block
  develop:
    large_change: warn
    config_and_code: warn
  release/*:
    "*": block  # all rules block on release branches

path_rules:
  auth/**:
    severity_boost: block
  payments/**:
    severity_boost: block
  migrations/**:
    severity_boost: warn
  "**/Dockerfile":
    dependency_change: block
  "**/*.lock":
    dependency_change: block

freeze_windows: []  # add windows like: [{name: "code-freeze", start: "2026-12-20T00:00:00Z", end: "2027-01-02T00:00:00Z", branches: ["main"]}]

fail_on:
  - block
