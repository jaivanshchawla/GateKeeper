# Gatekeeper Configuration
# Override per-repo by placing .gatekeeper.yml in your repo root.
# See docs for each rule's options.

rules:
  large_change:
    max_lines: 500
    severity: warn

  too_many_files:
    max_files: 20
    severity: warn

  no_tests:
    severity: warn
    exempt_paths:
      - "docs/**"
      - "*.md"
      - "*.rst"

  config_and_code:
    severity: warn

  revert_hotspot:
    revert_count: 3
    window_days: 60
    severity: block

  first_touch:
    severity: info

  weekend_deploy:
    severity: info

  stale_file:
    days: 180
    severity: info

  direct_to_main:
    severity: warn

ml_scoring:
  enabled: true
  band_thresholds:
    high: 0.90
    medium: 0.75

reviewer_suggestions:
  enabled: true
  max_suggestions: 3
  half_life_days: 180
  exclude_bots: true
  bot_patterns:
    - "dependabot"
    - "renovate"
    - "*[bot]"
    - "github-actions"

content_analysis:
  enabled: true  # default true locally, false for hosted API

fail_on:
  - block
