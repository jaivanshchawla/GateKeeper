# Pre-commit hooks for Gatekeeper
# Install as PRE-PUSH hook: pre-commit install --hook-type pre-push

repos:
  # Detect secrets in code
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: ["--fix"]

  # Local hook: Check for data leakage
  - repo: local
    hooks:
      - id: check-data-leakage
        name: Check for data leakage
        entry: python scripts/check_data_leakage.py
        language: python
        language_version: python3
        pass_filenames: false
        always_run: true
        additional_dependencies: [pandas, scikit-learn, pyyaml]

      # Gate 1: Score outgoing commits (warns on high, never blocks by default)
      - id: gate1-score-push
        name: Gate 1 — Score push risk
        entry: python scripts/pre_push_score.py
        language: python
        language_version: python3
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        additional_dependencies:
          - numpy
          - pandas
          - scikit-learn
          - lightgbm
          - skops
          - pyyaml
          - pydriller

      # Local hook: Run pytest
      - id: pytest
        name: Run tests
        entry: python -m pytest tests/ -x -q
        language: python
        language_version: python3
        pass_filenames: false
        always_run: true
        additional_dependencies:
          - pytest
          - httpx
          - numpy
          - pandas
          - scikit-learn
          - lightgbm
          - mlflow
          - skops
          - fastapi
          - pyyaml
          - pydriller
